name: 급등급락 텔레그램 봇

on:
  schedule:
    # UTC 00~06시 정각(월~금) = 한국시간(KST) 09~15시 정각, 매시 1회.
    # 한국 증시 운영시간(평일 09:00~15:30)에만 발송.
    - cron: '0 0-6 * * 1-5'
  workflow_dispatch:   # Actions 탭에서 수동 실행(테스트) 버튼

jobs:
  movers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 급등·급락 조회 후 텔레그램 발송
        run: node scripts/stock-movers.mjs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
